[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dox-fundus"
version = "1.0.0"
description = "Binocular CFP ocular disease detection via RETFound fine-tuning and dual-stream feature fusion."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Li Shunuo" },
    { name = "Yue Tong" },
    { name = "Xu Chun" },
    { name = "Zhang Yawen" },
    { name = "Liu Jialing" },
]
keywords = [
    "fundus", "retinal-image", "multi-label-classification",
    "foundation-model", "LoRA", "adapter", "RETFound", "ophthalmology",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "timm==1.0.15",
    "einops==0.8.1",
    "numpy==2.0.1",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "openpyxl>=3.1.0",
    "Pillow==10.4.0",
    "opencv-python>=4.9.0",
    "IETK-Ret==0.1.1",
    "matplotlib==3.10.0",
    "tqdm==4.67.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.5",
    "isort>=5.13",
    "mypy>=1.10",
]

[project.urls]
Homepage   = "https://github.com/<your-org>/DOX"
Issues     = "https://github.com/<your-org>/DOX/issues"
Repository = "https://github.com/<your-org>/DOX"

# ============================================================
# Tool Configurations
# ============================================================

[tool.setuptools.packages.find]
where = ["."]
include = ["modeling*", "datasets*", "train*"]
exclude = ["tests*", "datademo*", "docs*", "configs*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # 行长由 black 控制

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"
